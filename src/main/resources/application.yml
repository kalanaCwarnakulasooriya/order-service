server:
  port: 8082

spring:
  application:
    name: order-service
  data:
    mongodb:
      uri: mongodb://${MONGO_HOST:localhost}:${MONGO_PORT:27017}/${MONGO_DB:order_db}
      auto-index-creation: true

notification:
  service:
    url: http://${NOTIFICATION_SERVICE_NAME:notification-service}/api/v1/notifications

eureka:
  instance:
    prefer-ip-address: true
  client:
    service-url:
      defaultZone: http://${EUREKA_SERVER_HOST:localhost}:${EUREKA_SERVER_PORT:8761}/eureka/

management:
  endpoints:
    web:
      exposure:
        include: health,info
